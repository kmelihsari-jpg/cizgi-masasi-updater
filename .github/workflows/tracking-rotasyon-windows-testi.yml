name: Cizgi Masasi - Windows Tracking ve Rotasyon Testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kaynak-testi:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ESPN rotasyon ve NBA kaynak testi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/tracking_kaynak_testi.py
          if ($LASTEXITCODE -ne 0) { Write-Warning 'ESPN kaynak testi basarisiz; NBA Windows testi devam ediyor.' }

      - name: Windows uzerinden orijinal NBA tracking yontemini dene
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $day = '11/13/2026'
          $season = '2026-27'
          $out = @{ source = 'stats.nba.com'; method = 'Windows HttpWebRequest'; date = $day; results = @{} }
          foreach ($measure in @('Passing', 'Rebounding')) {
            $params = [ordered]@{
              College = ''; Conference = ''; Country = ''; DateFrom = $day; DateTo = $day
              Division = ''; DraftPick = ''; DraftYear = ''; GameScope = ''; Height = ''
              LastNGames = '0'; LeagueID = '00'; Location = ''; Month = '0'; OpponentTeamID = '0'
              Outcome = ''; PORound = '0'; PerMode = 'Totals'; PlayerExperience = ''
              PlayerOrTeam = 'Player'; PlayerPosition = ''; PtMeasureType = $measure
              Season = $season; SeasonSegment = ''; SeasonType = 'Regular Season'
              StarterBench = ''; TeamID = '0'; VsConference = ''; VsDivision = ''; Weight = ''
            }
            $query = ($params.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
            $url = 'https://stats.nba.com/stats/leaguedashptstats?' + $query
            Write-Host "Testing $measure via Windows HttpWebRequest ..."
            try {
              $req = [System.Net.HttpWebRequest]::Create($url)
              $req.Method = 'GET'
              $req.UserAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
              $req.Accept = 'application/json, text/plain, */*'
              $req.Referer = 'https://www.nba.com/'
              $req.Headers.Add('Accept-Language', 'en-US,en;q=0.9')
              $req.Headers.Add('Origin', 'https://www.nba.com')
              $req.Headers.Add('x-nba-stats-origin', 'stats')
              $req.Headers.Add('x-nba-stats-token', 'true')
              $req.Headers.Add('Sec-Fetch-Site', 'same-site')
              $req.Headers.Add('Sec-Fetch-Mode', 'cors')
              $req.Headers.Add('Sec-Fetch-Dest', 'empty')
              $req.AutomaticDecompression = [System.Net.DecompressionMethods]::GZip -bor [System.Net.DecompressionMethods]::Deflate
              $req.Timeout = 20000
              $req.ReadWriteTimeout = 20000
              $resp = $req.GetResponse()
              try {
                $reader = [System.IO.StreamReader]::new($resp.GetResponseStream())
                try { $doc = $reader.ReadToEnd() | ConvertFrom-Json -Depth 30 }
                finally { $reader.Dispose() }
              } finally { $resp.Dispose() }
              $rs = if ($doc.resultSets) { $doc.resultSets[0] } else { $doc.resultSet }
              if (-not $rs -or -not $rs.headers) { throw 'NBA JSON beklenen sutunlari icermiyor' }
              $field = if ($measure -eq 'Passing') { 'POTENTIAL_AST' } else { 'REB_CHANCES' }
              $hasField = @($rs.headers) -contains $field
              $rowCount = @($rs.rowSet).Count
              $out.results[$measure] = @{ ok = ($hasField -and $rowCount -gt 0); rows = $rowCount; field = $field; field_found = $hasField }
              Write-Host "$measure : rows=$rowCount ; $field exists=$hasField"
            } catch {
              $message = $_.Exception.Message
              $out.results[$measure] = @{ ok = $false; error = $message.Substring(0, [Math]::Min(220, $message.Length)) }
              Write-Warning "$measure FAIL: $message"
            }
          }
          $out | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 windows-tracking-raporu.json
          Write-Host 'Rapor: windows-tracking-raporu.json'
          Write-Host 'Bu test seed/data.json ve Cloudflare sitesini degistirmez.'

      - name: Raporlari sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-rotasyon-windows-${{ github.run_id }}
          path: |
            tracking-kaynak-raporu.json
            windows-tracking-raporu.json
          if-no-files-found: warn
          retention-days: 7
