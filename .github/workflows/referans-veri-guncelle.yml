name: Cizgi Masasi - DVP ve TeamRankings Dosya Uretimi

on:
  workflow_dispatch:
    inputs:
      kaynak:
        description: 'Hangi veri dosyasini uretelim?'
        type: choice
        required: true
        default: both
        options:
          - dvp
          - teamrankings
          - rotation
          - both

  schedule:
    # Her gun 08:20 Turkiye saati (DVP + TeamRankings + Rotasyon)
    - cron: '20 5 * * *'

permissions:
  contents: write

concurrency:
  group: referans-veri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  veri-uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository kodunu al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kaynak verileri oku
        env:
          KAYNAK: ${{ github.event_name == 'schedule' && 'both' || inputs.kaynak }}
        shell: bash
        run: |
          set -uo pipefail
          echo "Istenen veri: ${KAYNAK}"
          mkdir -p out
          run_one() { python scripts/update_reference_stats.py --source "$1" --out out || echo "::warning::$1 uretilemedi"; }
          run_rot() { python scripts/rotation_fetch.py --out out/rotation.json --prev seed/rotation.json || echo "::warning::rotasyon uretilemedi"; }
          case "$KAYNAK" in
            dvp) run_one dvp ;;
            teamrankings) run_one teamrankings ;;
            rotation) run_rot ;;
            *) run_one dvp; run_one teamrankings; run_rot ;;
          esac

      - name: Dogrula (bozuk dosya yazilmaz)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          ok = 0
          for f in sorted(Path('out').glob('*.json')):
              try:
                  obj = json.loads(f.read_text(encoding='utf-8'))
                  if f.name == 'dvp.json':
                      teams = obj.get('t', {})
                      assert len(teams) == 30, 'DVP takim sayisi 30 olmali'
                      assert all(set(p) == {'PG','SG','SF','PF','C'} for p in teams.values()), 'DVP pozisyon eksik'
                      print('DVP dogrulandi:', obj.get('updated'))
                  elif f.name == 'teamrankings.json':
                      n = len(obj.get('s', {}))
                      assert n >= 140, f'TeamRankings en az 140 kategori olmali: {n}'
                      print('TeamRankings dogrulandi:', n, obj.get('updated'))
                  elif f.name == 'rotation.json':
                      t = obj.get('t', {})
                      assert len(t) >= 28 and obj.get('updated'), f'Rotasyon eksik: {len(t)} takim'
                      assert all(len(p.get('b', [])) == 48 for v in t.values() for p in v.get('p', [])), 'b dizisi 48 degil'
                      print('Rotasyon dogrulandi:', len(t), 'takim,', obj.get('updated'))
                  else:
                      continue
                  ok += 1
              except Exception as e:
                  print(f'::warning::{f.name} gecersiz, yazilmayacak: {e}')
                  f.unlink()
          if ok == 0:
              sys.exit('Gecerli dosya yok')
          PY

      - name: seed/ klasorune kaydet ve commit'le
        shell: bash
        run: |
          set -euo pipefail
          for f in dvp teamrankings rotation; do
            if [ -f "out/$f.json" ]; then cp "out/$f.json" "seed/$f.json"; git add "seed/$f.json"; fi
          done
          if git diff --cached --quiet; then echo "Degisiklik yok"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Referans veri: DVP/TeamRankings/Rotasyon $(TZ=Europe/Istanbul date +%F)"
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push origin HEAD:main; then exit 0; fi
            sleep 10
          done
          echo "Push basarisiz"; exit 1
