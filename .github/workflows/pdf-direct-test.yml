
name: NBA Dogrudan PDF Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Python hazirla
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PDF kutuphaneleri
        run: pip install requests pdfplumber

      - name: NBA PDF oku
        run: |
          python - <<'PY'
          import io
          import requests
          import pdfplumber

          url = (
            "https://ak-static.cms.nba.com/referee/"
            "injury/Injury-Report_2026-11-14_12_00PM.pdf"
          )

          headers = {
            "User-Agent": "Mozilla/5.0",
            "Accept": "application/pdf"
          }

          response = requests.get(
            url, headers=headers, timeout=30
          )

          print("HTTP STATUS:", response.status_code)
          response.raise_for_status()

          if not response.content.startswith(b"%PDF-"):
            raise RuntimeError("Gelen dosya PDF degil")

          with pdfplumber.open(
            io.BytesIO(response.content)
          ) as pdf:
            print("PDF SAYFA SAYISI:", len(pdf.pages))

            for page in pdf.pages[:2]:
              text = page.extract_text() or ""
              print(text[:5000])

          print("PDF OKUMA BASARILI")
          PY
