name: Cizgi Masasi - CourtSketch Public Source Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe public CourtSketch pages without altering data
        run: python3 scripts/courtsketch_public_probe.py
