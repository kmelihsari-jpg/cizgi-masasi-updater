name: Cizgi Masasi - NBA Tracking Erisim Testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracking-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: NBA API yukle
        run: python -m pip install 'nba_api==1.11.6'

      - name: NBA Stats tracking verilerini test et (site dosyalari degismez)
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          from nba_api.stats.endpoints import leaguedashptstats

          now = datetime.now(ZoneInfo('America/New_York'))
          start = now.year if now.month >= 10 else now.year - 1
          season = f'{start}-{(start + 1) % 100:02d}'
          kinds = ['Passing', 'Rebounding', 'Drives', 'CatchShoot', 'PullUpShot', 'PaintTouch']
          report = {'season': season, 'endpoint': 'stats.nba.com/stats/leaguedashptstats', 'results': []}
          Path('out').mkdir(exist_ok=True)
          for kind in kinds:
              entry = {'type': kind, 'success': False}
              print(f'\n--- {kind} / {season} ---', flush=True)
              try:
                  endpoint = leaguedashptstats.LeagueDashPtStats(
                      season=season,
                      season_type_all_star='Regular Season',
                      player_or_team='Player',
                      pt_measure_type=kind,
                      per_mode_simple='Totals',
                      timeout=30,
                  )
                  result = endpoint.get_dict()
                  sets = result.get('resultSets') or result.get('resultSet') or []
                  if isinstance(sets, dict):
                      sets = [sets]
                  dataset = next((s for s in sets if isinstance(s, dict) and s.get('rowSet') is not None), None)
                  if dataset is None:
                      raise ValueError('Beklenen rowSet yok')
                  headers = dataset.get('headers', [])
                  rows = dataset.get('rowSet', [])
                  if not headers or not rows:
                      raise ValueError('Bos sutun/oyuncu sonucu')
                  entry.update(success=True, players=len(rows), columns=headers)
                  print('BASARILI: oyuncu sayisi =', len(rows), flush=True)
                  print('ALANLAR:', ', '.join(map(str, headers)), flush=True)
              except Exception as exc:
                  entry['error'] = f'{type(exc).__name__}: {str(exc)[:250]}'
                  print('HATA:', entry['error'], flush=True)
              report['results'].append(entry)
              time.sleep(3)

          path = Path('out/tracking-erisim-raporu.json')
          path.write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')
          summary_path = os.getenv('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write(f'## NBA Tracking erisim testi — {season}\n\n')
                  f.write('| Veri | Durum | Oyuncu | Aciklama |\n|---|---|---:|---|\n')
                  for r in report['results']:
                      explanation = str(r.get('error', 'Sutunlar logda')).replace('|', '/')
                      f.write(f"| {r['type']} | {'BASARILI' if r['success'] else 'HATA'} | {r.get('players', 0)} | {explanation} |\n")
                  f.write('\nTest sadece okuma yapar; hiçbir site dosyasını değiştirmez.\n')
          successes = sum(r['success'] for r in report['results'])
          print(f'\nSONUC: {successes}/{len(kinds)} tracking turu basarili', flush=True)
          if successes == 0:
              raise SystemExit('NBA Stats bu GitHub runnerindan henuz erisilebilir degil. Site dosyalari korunuyor.')
          PY

      - name: Raporu kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-tracking-erisim-raporu
          path: out/tracking-erisim-raporu.json
          if-no-files-found: warn
          retention-days: 7
