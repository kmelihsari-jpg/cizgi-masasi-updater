name: NBA Alternatif Veri Erisim Testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ESPN boxscore ve referans sitelerini test et
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36',
              'Accept': 'application/json, text/html;q=0.9, */*;q=0.8',
          }

          def request(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.status, response.read(2_000_000)

          results = []
          game_id = None
          # Amerika dogu saati ile dunun maclarini kontrol et.
          date = (datetime.now(ZoneInfo('America/New_York')) - timedelta(days=1)).strftime('%Y%m%d')
          print('Kontrol edilen ESPN mac tarihi:', date, flush=True)

          tests = [
              ('ESPN Scoreboard', f'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates={date}'),
              ('Hashtag DVP', 'https://hashtagbasketball.com/nba-defense-vs-position'),
              ('TeamRankings', 'https://www.teamrankings.com/nba/'),
          ]
          for name, url in tests:
              print('\n--- ' + name + ' ---', flush=True)
              try:
                  status, raw = request(url)
                  if name == 'ESPN Scoreboard':
                      data = json.loads(raw)
                      events = data.get('events', [])
                      if not isinstance(events, list):
                          raise ValueError('events alani dizi degil')
                      print('HTTP', status, '| mac sayisi:', len(events), flush=True)
                      for ev in events:
                          if ev.get('id'):
                              game_id = str(ev['id'])
                              break
                      result = f'OK: {len(events)} mac'
                  else:
                      text = raw.decode('utf-8', errors='replace')
                      if '<html' not in text.lower() and '<table' not in text.lower():
                          raise ValueError('Beklenen HTML bulunamadi')
                      print('HTTP', status, '| HTML bayt:', len(raw), flush=True)
                      result = 'OK: HTML erisimi var; tablo ayristirma henuz test edilmedi'
                  results.append((name, result))
              except Exception as exc:
                  result = f'HATA: {type(exc).__name__}: {str(exc)[:100]}'
                  print(result, flush=True)
                  results.append((name, result))

          if game_id:
              print('\n--- ESPN Mac Ozeti / Boxscore ---', flush=True)
              try:
                  status, raw = request(f'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event={game_id}')
                  data = json.loads(raw)
                  boxscore = data.get('boxscore') or {}
                  teams = boxscore.get('players', [])
                  player_rows = sum(len(stat.get('athletes', [])) for team in teams for stat in team.get('statistics', []))
                  if player_rows <= 0:
                      raise ValueError('Boxscore icinde oyuncu istatistigi bulunamadi')
                  result = f'OK: HTTP {status}, {player_rows} oyuncu satiri'
                  print(result, '| game_id:', game_id, flush=True)
                  results.append(('ESPN Boxscore', result))
              except Exception as exc:
                  result = f'HATA: {type(exc).__name__}: {str(exc)[:100]}'
                  print(result, flush=True)
                  results.append(('ESPN Boxscore', result))
          else:
              print('\nDunun listesinde mac bulunamadi veya Scoreboard erisilemedi; Boxscore testi atlandi.', flush=True)
              results.append(('ESPN Boxscore', 'ATLANDI: mac ID yok'))

          print('\n=== TEST SONUCLARI ===', flush=True)
          for name, result in results:
              print(name + ': ' + result, flush=True)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write('## Alternatif veri erisim testi\n\n| Kaynak | Sonuc |\n|---|---|\n')
                  for name, result in results:
                      f.write(f'| {name} | {result.replace("|", "/")} |\n')
          if not any(name == 'ESPN Boxscore' and result.startswith('OK') for name, result in results):
              raise SystemExit('ESPN Boxscore dogrulanamadi; site verileri degistirilmedi.')
          PY
