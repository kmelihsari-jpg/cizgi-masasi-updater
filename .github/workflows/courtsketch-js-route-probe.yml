name: Cizgi Masasi - CourtSketch JS Route Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-js:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect same-origin public JavaScript route hints (read only)
        run: python3 scripts/courtsketch_js_probe.py
