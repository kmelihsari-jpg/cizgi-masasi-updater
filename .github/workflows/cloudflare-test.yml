
name: Cloudflare NBA Baglanti Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Cloudflare API test
        run: |
          python - <<'PY'
          import json
          import urllib.request

          print("YENI TEST KODU CALISIYOR")

          url = (
              "https://cizgi-masasi-api."
              "k-melihsari.workers.dev/api/test-nba"
          )

          with urllib.request.urlopen(
              url, timeout=30
          ) as response:
              data = json.load(response)

          print(json.dumps(data, indent=2))

          if not data.get("success"):
              raise RuntimeError("NBA API testi basarisiz")

          print("CLOUDFLARE BAGLANTISI BASARILI")
          PY
