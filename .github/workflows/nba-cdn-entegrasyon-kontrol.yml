name: Cizgi Masasi - NBA CDN Entegrasyon Kontrolu
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CDN verilerini mevcut seed semasi ile karsilastir - sadece okuma
        run: python scripts/cdn_mapping_report.py
      - name: Raporu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-cdn-entegrasyon-raporu
          path: out/nba-cdn-entegrasyon-raporu.json
          if-no-files-found: warn
          retention-days: 7
