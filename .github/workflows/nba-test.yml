
name: NBA Sakatlik PDF Testi

on:
  workflow_dispatch:

jobs:
  test-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneleri yukle
        run: pip install requests pdfplumber

      - name: NBA PDF dosyasini oku
        shell: bash
        run: |
          python - <<'PY'
          import io
          import requests
          import pdfplumber

          API = (
              "https://cizgi-masasi-api."
              "k-melihsari.workers.dev/api/test-nba"
          )

          result = requests.get(API, timeout=30)
          result.raise_for_status()

          info = result.json()

          if not info.get("success"):
              raise RuntimeError(
                  f"Cloudflare testi basarisiz: {info}"
              )

          pdf_url = info["report_url"]
          print("Bulunan rapor:", pdf_url)

          response = requests.get(
              pdf_url, timeout=30
          )
          response.raise_for_status()

          if not response.content.startswith(b"%PDF-"):
              raise RuntimeError("Gelen dosya PDF degil")

          with pdfplumber.open(
              io.BytesIO(response.content)
          ) as pdf:
              print("Sayfa sayisi:", len(pdf.pages))

              for page in pdf.pages[:2]:
                  text = page.extract_text() or ""
                  print("--- RAPOR ICERIGI ---")
                  print(text[:3000])

          print("TEST BASARILI")
          PY
