name: Cizgi Masasi - Iddaa NBA Barem Senkronizasyonu

on:
  # Zamanlama artik Cloudflare Worker'da (cizgi-sakatlik-tetik): workflow_dispatch ile Istanbul 16:05'ten 02:05'e saatte 1 (20 Kasim 2026).
  # GitHub'in kendi cron'u gecikmeli/atlamali oldugu icin kapatildi.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cizgi-masasi-iddaa-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Iddaa NBA baremlerini dogrula ve oku
        run: python scripts/iddaa_fetch.py --data seed/data.json --output seed/iddaa-lines.json
      - name: JSON yapisini kontrol et
        shell: bash
        run: |
          python3 - <<'PY_CHECK'
          import json, pathlib, time
          p=pathlib.Path('seed/iddaa-lines.json')
          if not p.exists():
              print('Yeni veri gelmedi, eski seed dosyasi yok. Yayina degisiklik yok.')
          else:
              d=json.loads(p.read_text(encoding='utf-8'))
              assert isinstance(d.get('rows'),list)
              assert int(d.get('count',-1))==len(d['rows'])
              for row in d['rows']:
                  vals=row.split('|')
                  assert len(vals)==5 and vals[1] in ('PTS','REB','AST','STL','BLK','3PM','SRA','RA')
              print('KONTROL OK:',len(d['rows']),'satir')
          PY_CHECK
      - name: Baremleri arsive ekle (sadece-ekleme)
        # Arsiv basarisiz olsa bile guncel barem yayini aksamasin.
        continue-on-error: true
        run: python scripts/iddaa_archive.py --lines seed/iddaa-lines.json --archive arsiv/iddaa --source github-sync
      - name: Dosya degisti mi
        id: diff
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- seed/iddaa-lines.json arsiv/iddaa)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Yalnizca degisen baremleri commit et
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seed/iddaa-lines.json
          if [ -d arsiv/iddaa ]; then git add arsiv/iddaa; fi
          git commit -m 'Update iddaa NBA player lines'
          # Baska job ayni anda main'e yazmissa once rebase et.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
