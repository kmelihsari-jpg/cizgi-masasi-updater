name: Cizgi Masasi - Otomatik Site Yayini

on:
  workflow_dispatch:
    inputs:
      yayinla:
        description: 'Ilk testte false sec; kontrol ettikten sonra true'
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'site-patches/**'
      - 'scripts/site_update_status.py'
      - 'scripts/dvp_position_patch.py'
      - 'scripts/karne_returning.py'
      - 'scripts/vitrin_sakatlik_kur.py'
      - 'seed/confirmed-active.json'
  workflow_run:
    workflows:
      - 'Cizgi Masasi - Gunluk Oyuncu Istatistikleri'
      - 'Cizgi Masasi - NBA CDN Guvenli Uygula'
      - 'Cizgi Masasi - Yerel Tracking Verisini Birlestir'
      - 'Cizgi Masasi - Iddaa NBA Barem Senkronizasyonu'
      - 'Cizgi Masasi - Karne Otomasyonu'
      - 'Cizgi Masasi - Periyot ve Rotasyon Verileri'
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  issues: write   # yalniz Cloudflare kota uyarisi issue'su (ayda en fazla 2)

concurrency:
  group: cizgi-masasi-pages-production
  cancel-in-progress: false

jobs:
  siteyi-hazirla:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: GitHub verilerini al
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cloudflare Pages aylik deploy sayaci (tum projeler, sadece okur)
        id: kota
        continue-on-error: true
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cf_deploy_sayac.py --out cf-kota.json

      - name: Yayin gerekli mi (Pages ayda 500 deploy; degisiklik yoksa atla)
        id: gerek
        shell: bash
        env:
          OLAY: ${{ github.event_name }}
          KAYNAK: ${{ github.event.workflow_run.name }}
          CF_TOPLAM: ${{ steps.kota.outputs.cf_toplam }}
        run: python3 scripts/yayin_gerekli.py

      - name: Mevcut siteyi koruyarak yayin paketini hazirla
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.error, time, shutil
          base = 'https://cizgi-masasi.pages.dev/'
          folder = pathlib.Path('public')
          folder.mkdir(exist_ok=True)
          assets = '''index.html service-worker.js styles.css tema.css ek.css app.js model.js
          gorunum-ana.js gorunum-oyuncu.js gorunum-diger.js karne.js karakter.js
          okuyucular.js ekler.js baslat.js canli-sakatlik.js
          avatars.json teamrankings.json odds.json avatar-map.json inj-man.json
          history.json iddaa-lines.json rotation.json dvp.json injuries.json
          periods.json starts-2526.json inj-live.json karne.json
          favicon-16.png favicon-32.png favicon-48.png favicon.ico
          avatar-sheet-1.webp avatar-sheet-2.webp manifest.webmanifest
          icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png'''.split()
          for name in assets:
              destination = folder / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              error = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(base + name, headers={
                          'User-Agent': 'Mozilla/5.0 (compatible; CizgiMasasiUpdater/1.0)',
                          'Accept': '*/*',
                      })
                      with urllib.request.urlopen(request, timeout=20) as response:
                          data = response.read(15_000_000)
                          media_type = response.headers.get('Content-Type', '')
                      if not data:
                          raise ValueError('Bos dosya: ' + name)
                      if not name.endswith(('.html','.js','.css','.json','.webmanifest')) and media_type.startswith('text/html'):
                          raise ValueError('Beklenen varlik yerine HTML geldi: ' + name)
                      destination.write_bytes(data)
                      print('ALINDI', name, len(data), flush=True)
                      break
                  except Exception as exc:
                      error = exc
                      time.sleep(attempt + 1)
              else:
                  raise RuntimeError(f'Site dosyasi alinamadi: {name}: {error}')
          data_file = pathlib.Path('seed/data.json')
          if not data_file.exists():
              raise RuntimeError('GitHub seed/data.json bulunamadi')
          stats = json.loads(data_file.read_text(encoding='utf-8'))
          for field in ('cols','rows','players','teams','dates'):
              if field not in stats:
                  raise RuntimeError('data.json eksik alan: ' + field)
          if len(stats['rows']) < 3900:
              raise RuntimeError('Oyuncu mac kaydi beklenenden az, yayin durduruldu')
          # Hayalet satir = 0 dk ve ilk 5 isaretli (oynamayan oyuncu). Sayfa "satiri var = oynadi"
          # sayar; bu yuzden bu satirlar "X yokken", missedStreak, mpg ve Kasa'yi bozar.
          def _phantoms(d):
              c = {n: i for i, n in enumerate(d['cols'])}
              return [r for r in d['rows'] if r[c['min']] == 0 and r[c['start']]]
          bad = _phantoms(stats)
          if bad:
              raise RuntimeError(f'{len(bad)} hayalet oyuncu satiri (0 dk + ilk 5) var; yayin durduruldu')
          # Eksik box score: takim dakikalari 240+25xUT'ye kapanmiyorsa satirsiz oyuncular "oynamadi"
          # diye yorumlanir (yanlis X yokken). Eksik macli veriyle yayin yapma.
          import sys
          sys.path.insert(0, 'scripts')
          from box_quality import partial_games
          partial = partial_games(stats)
          if partial:
              raise RuntimeError('Eksik box score suphesi (dakika kapanmiyor): ' + ', '.join(f'{d} {t}' for d, t in sorted(partial)[:10]) + '; yayin durduruldu')
          previous = json.loads((folder / 'data.json').read_text(encoding='utf-8')) if (folder / 'data.json').exists() else None
          if previous is not None:
              # Yayindaki veride hayalet satir varsa, onlarin silinmesi veri kaybi sayilmaz.
              previous_real = len(previous.get('rows', [])) - len(_phantoms(previous))
              if len(stats['rows']) < previous_real:
                  raise RuntimeError('GitHub verisi yayindaki veriden eski, yayin durduruldu')
          shutil.copyfile(data_file, folder / 'data.json')
          # Karne V1: yalnızca yeni dönemin doğrulanmış kayıtlarını yayımla.
          karne_seed = pathlib.Path('seed/karne.json')
          if karne_seed.is_file():
              import json as cm_json
              card = cm_json.loads(karne_seed.read_text(encoding='utf-8'))
              if card.get('startDate') != '2026-11-21' or not isinstance(card.get('docs'), list):
                  raise RuntimeError('KARNE seed format hatasi')
              (folder / 'karne.json').write_text(cm_json.dumps(card,ensure_ascii=False,indent=2)+'\n', encoding='utf-8')
          # Çalışan sitenin JS'sine dokunma: ek yama dosyalarını yayınla.
          for patch in ('karne-v1.js', 'karne-v1.css'):
              src = pathlib.Path('site-patches') / patch
              shutil.copyfile(src, folder / patch)
          page_file=folder / 'index.html'
          html=page_file.read_text(encoding='utf-8')
          if 'id="cm-v1-vitrin"' not in html:
              hook='<div class="hgames" id="h-games"'
              if hook not in html:raise RuntimeError('Vitrin ekleme noktasi yok')
              html=html.replace(hook,'<section id="cm-v1-vitrin" aria-label="Kasa ve Karne Vitrini"></section>\n    '+hook,1)
          if 'karne-v1.css' not in html:
              html=html.replace('</head>', '<link rel="stylesheet" href="karne-v1.css?v=1">\n</head>',1)
          if 'karne-v1.js' not in html:
              html=html.replace('<script src="baslat.js', '<script src="karne-v1.js?v=1"></script>\n<script src="baslat.js',1)
          page_file.write_text(html,encoding='utf-8')
          print('KARNE V1 site yamasina eklendi')
          # Github senkronizasyonundan gelen oyuncu baremleri. Eski web kopyasini ez.
          iddaa_seed = pathlib.Path('seed/iddaa-lines.json')
          if iddaa_seed.is_file():
              iddaa = json.loads(iddaa_seed.read_text(encoding='utf-8'))
              rows = iddaa.get('rows')
              if not isinstance(rows, list) or int(iddaa.get('count', -1)) != len(rows):
                  raise RuntimeError('Iddaa seed JSON gecersiz; yayin durduruldu')
              now_unix = int(time.time())
              # Sadece henuz baslamamis mac satirlari; baslamis maclari asla yayinlama.
              live_rows = []
              for r in rows:
                  parts = str(r).split('|')
                  if len(parts) != 5:
                      raise RuntimeError('Gecersiz iddaa satiri; yayin durduruldu')
                  if int(parts[4]) > now_unix:
                      live_rows.append(r)
              iddaa['rows'] = live_rows
              iddaa['count'] = len(live_rows)
              # 6 saatten eski cekim kullanilmaz. Hata durumunda eski oranlari kaldir.
              if now_unix * 1000 - int(iddaa.get('ts', 0)) > 6 * 3600 * 1000:
                  iddaa['rows'] = []
                  iddaa['count'] = 0
                  iddaa['stale'] = True
              (folder / 'iddaa-lines.json').write_text(
                  json.dumps(iddaa, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print('IDDAA siteye eklendi:', iddaa['count'], 'satir; stale=', bool(iddaa.get('stale', False)))
          # Çeyrek/rotasyon verilerini yalnızca doğrulanmış ve daha yeni ise ekle.
          # Kaynak yoksa mevcut canlı dosyayı koru.
          import datetime
          for name in ('periods.json', 'rotation.json'):
              incoming = pathlib.Path('seed') / name
              current = folder / name
              if not incoming.is_file():
                  print('KORUNDU (seed yok)', name)
                  continue
              fresh = json.loads(incoming.read_text(encoding='utf-8'))
              old = json.loads(current.read_text(encoding='utf-8')) if current.exists() else None
              if name == 'periods.json':
                  if not isinstance(fresh.get('dates'), list) or not isinstance(fresh.get('cols'),list) or not isinstance(fresh.get('rows'),list):
                      raise RuntimeError('periods.json beklenmeyen yapida')
                  required = {'pid','d','q','min','pts','reb','ast'}
                  if not required.issubset(fresh['cols']) or len(fresh['rows']) < 100:
                      raise RuntimeError('periods.json temel sutunlar / satirlar eksik')
                  if old and old.get('dates'):
                      if not fresh['dates'] or fresh['dates'][-1] < old['dates'][-1]:
                          print('KORUNDU (daha eski tarih)', name)
                          continue
                      if fresh['dates'][-1] == old['dates'][-1] and len(fresh['rows']) < len(old.get('rows',[])):
                          print('KORUNDU (satir sayisi azaldi)', name)
                          continue
              else:
                  if not isinstance(fresh.get('t'), dict) or len(fresh['t']) < 20 or not fresh.get('updated'):
                      raise RuntimeError('rotation.json beklenmeyen yapi')
                  if old and old.get('updated') and fresh['updated'] < old['updated']:
                      print('KORUNDU (eski rotasyon)', name)
                      continue
              shutil.copyfile(incoming,current)
              print('EKLENDI', name, len(incoming.read_bytes()))
          (folder / '_headers').write_text('''/service-worker.js
            Cache-Control: no-cache, no-store, must-revalidate
          /manifest.webmanifest
            Content-Type: application/manifest+json
          /*.json
            Cache-Control: no-cache, max-age=0, must-revalidate
          ''', encoding='utf-8')
          html = (folder / 'index.html').read_text(encoding='utf-8')
          if 'baslat.js' not in html or 'canli-sakatlik.js' not in html:
              raise RuntimeError('Canli sakatlik entegrasyonu veya baslatma kodu bulunamadi; yayin durduruldu')
          if len(html) < 10000:
              raise RuntimeError('index.html beklenenden kisa; yayin durduruldu')
          print('DOGRU: Site dosyalari korundu, seed/data.json eklendi.')
          print('Oyuncu-mac kaydi:', len(stats['rows']))
          print('Yayina hazir toplam dosya:', len([x for x in folder.rglob('*') if x.is_file()]))
          PY

      - name: Canli sakatlik butonlarini siteye uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path
          import shutil
          names = ('index.html', 'gorunum-ana.js', 'canli-sakatlik.js')
          patch_dir = Path('site-patches')
          public = Path('public')
          for name in names:
              original = public / name
              patch = patch_dir / name
              if not original.is_file() or not patch.is_file():
                  raise RuntimeError('Eksik site veya yama dosyasi: ' + name)
              if original.stat().st_size < 10000 or patch.stat().st_size < 10000:
                  raise RuntimeError('Beklenmeyen dosya boyutu: ' + name)
          html = (patch_dir/'index.html').read_text(encoding='utf-8')
          panel = (patch_dir/'canli-sakatlik.js').read_text(encoding='utf-8')
          home = (patch_dir/'gorunum-ana.js').read_text(encoding='utf-8')
          assert 'id="nba-inj-check"' in html
          assert 'id="inj-up"' in html
          assert "ESPN_REFRESH_API" in panel and "refresh(true, 'espn')" in panel
          assert 'Underdog baglantisi kapali' in home
          for name in names:
              shutil.copyfile(patch_dir/name, public/name)
              print('YAMA UYGULANDI', name)
          print('DOGRU: ESPN kontrolu ve NBA raporu butonlari hazir')
          PY_PATCH

      - name: Confirmed return model yamasini uygula
        shell: bash
        run: python3 scripts/karne_returning.py --model public/model.js --confirmed seed/confirmed-active.json

      - name: Vitrin, sakatlik ve mac basina 3 sinir yamasi
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_vitrin_sakatlik.py
          python3 scripts/vitrin_sakatlik_kur.py --site public --patches site-patches

      - name: Mobil genis gorunumu siteye ekle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_MOBILE_WIDE'
          from pathlib import Path
          import shutil
          src=Path('site-patches/mobile-wide-v1.css')
          dst=Path('public/mobile-wide-v1.css')
          html_file=Path('public/index.html')
          if not src.is_file() or not html_file.is_file():
              raise RuntimeError('Mobil CSS veya site index.html yok')
          html=html_file.read_text(encoding='utf-8')
          tag='<link rel="stylesheet" href="mobile-wide-v1.css?v=20261115a">'
          if tag not in html:
              if '</head>' not in html:
                  raise RuntimeError('index.html head etiketi bulunamadi')
              html=html.replace('</head>',tag+'\n</head>',1)
          shutil.copyfile(src,dst)
          html_file.write_text(html,encoding='utf-8')
          print('MOBIL WIDE CSS EKLENDI; analiz veri dosyalari degismedi')
          PY_MOBILE_WIDE

      - name: Mobil odakli kompakt gorunumu siteye ekle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CM_MOBILE_V2'
          from pathlib import Path
          import shutil
          public = Path('public')
          htmlpath = public / 'index.html'
          if not htmlpath.is_file():
              raise RuntimeError('public/index.html bulunamadi')
          html = htmlpath.read_text(encoding='utf-8')
          assert '</head>' in html and '</body>' in html, 'HTML head/body eksik'
          for f in ('mobile-focus-v2.css', 'mobile-focus-v2.js'):
              src = Path('site-patches') / f
              if not src.is_file(): raise RuntimeError('Eksik mobil yama: ' + f)
              shutil.copyfile(src, public / f)
          css_tag = '<link rel="stylesheet" href="mobile-focus-v2.css?v=20261115b">'
          js_tag = '<script defer src="mobile-focus-v2.js?v=20261115b"></script>'
          if 'mobile-focus-v2.css' not in html:
              html = html.replace('</head>', css_tag+'\n</head>', 1)
          if 'mobile-focus-v2.js' not in html:
              html = html.replace('</body>', js_tag+'\n</body>', 1)
          htmlpath.write_text(html, encoding='utf-8')
          print('MOBIL FOCUS V2 HAZIR: JS ve CSS yayinda; veri ve bahis kodlari korundu')
          PY_CM_MOBILE_V2

      - name: Mobil oyuncu ve ana sayfa V3 yamasini ekle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CM_MOBILE_V3'
          from pathlib import Path
          import shutil
          source = Path('site-patches/mobile-player-home-v3.css')
          destination = Path('public/mobile-player-home-v3.css')
          html_file = Path('public/index.html')
          assert source.is_file() and html_file.is_file(), 'V3 kaynak/site dosyasi bulunamadi'
          shutil.copyfile(source, destination)
          html = html_file.read_text(encoding='utf-8')
          tag = '<link rel="stylesheet" href="mobile-player-home-v3.css?v=20261115c">'
          if 'mobile-player-home-v3.css' not in html:
              assert '</head>' in html, 'HTML head kapanisi bulunamadi'
              html = html.replace('</head>', tag + '\n</head>', 1)
              html_file.write_text(html, encoding='utf-8')
          print('MOBIL V3 HAZIR: sol baslik + oyuncu grafik okunabilirligi')
          PY_CM_MOBILE_V3

      - name: Referans veri (seed DVP/TeamRankings)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          checks = (('dvp.json', lambda o: len(o.get('t', {})) == 30),
                    ('teamrankings.json', lambda o: len(o.get('s', {})) >= 140))
          for name, check in checks:
              src, dst = Path('seed') / name, Path('public') / name
              if not src.exists():
                  print(name, 'seed yok, canli kopya kaliyor'); continue
              try:
                  o = json.loads(src.read_text(encoding='utf-8')); assert check(o)
              except Exception as e:
                  print('::warning::' + name + ' gecersiz, canli kopya kaliyor: ' + str(e)); continue
              shutil.copyfile(src, dst)
              print(name, 'seed kopyasi yayina alindi:', o.get('updated'))
          PY

      - name: Oyuncu DVP manuel pozisyon secici V1
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dvp_position_patch.py --site public

      - name: Takim sekmesi yokken - devam eden yokluklar V1
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_takim_patch.py
          python3 scripts/takim_yokken_patch.py --site public

      - name: iPhone PWA Kupon ust guvenli alan V1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CM_PWA_SLIP'
          from pathlib import Path
          import shutil
          public = Path('public')
          html_path = public / 'index.html'
          if not html_path.is_file():
              raise RuntimeError('public/index.html yok')
          html = html_path.read_text(encoding='utf-8')
          if 'id="slip"' not in html or 'id="slip-close"' not in html:
              raise RuntimeError('Kupon paneli / kapatma dugmesi bulunamadi; yayin durduruldu')
          if '</head>' not in html or '</body>' not in html:
              raise RuntimeError('HTML kapanis etiketleri bulunamadi')
          for name in ('pwa-slip-safe-v1.css', 'pwa-slip-safe-v1.js'):
              source = Path('site-patches') / name
              if not source.is_file():
                  raise RuntimeError('Eksik kaynak: ' + str(source))
              shutil.copyfile(source, public / name)
          if 'pwa-slip-safe-v1.css' not in html:
              html = html.replace('</head>', '<link rel="stylesheet" href="pwa-slip-safe-v1.css?v=20261115d">\n</head>', 1)
          if 'pwa-slip-safe-v1.js' not in html:
              html = html.replace('</body>', '<script src="pwa-slip-safe-v1.js?v=20261115d"></script>\n</body>', 1)
          html_path.write_text(html, encoding='utf-8')
          print('PWA KUPON DUZELTMESI: guvenli ust alan, sabit kapatma dugmesi; baska veriye dokunulmadi')
          PY_CM_PWA_SLIP

      - name: Barem Gecmisi V2 (arsivden son 8 barem) yamasini ekle
        # Bu yama basarisiz olursa site yine eski haliyle yayinlansin.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_BAREM_GECMISI'
          import json, shutil
          from pathlib import Path
          public = Path('public')
          html_path = public / 'index.html'
          patch = Path('site-patches/barem-gecmisi.js')
          iddaa_files = sorted(Path('arsiv/iddaa').glob('lines-*.ndjson'))
          karne_files = sorted(Path('arsiv/karne').glob('karne-eski-*.json'))
          if not patch.is_file() or not iddaa_files or not karne_files or not html_path.is_file():
              raise RuntimeError('Barem Gecmisi: yama/arsiv/index eksik; dokunulmadi')
          html = html_path.read_text(encoding='utf-8')
          marker = '<script src="baslat.js'
          if 'barem-gecmisi.js' not in html and marker not in html:
              raise RuntimeError('Barem Gecmisi: baslat.js etiketi bulunamadi; dokunulmadi')
          lines = []
          for f in iddaa_files:
              for n, line in enumerate(f.read_text(encoding='utf-8').splitlines(), 1):
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  if not isinstance(row, list) or len(row) != 7:
                      raise RuntimeError(f'Barem arsivi gecersiz satir: {f.name}:{n}')
                  lines.append(line)
          old = json.loads(karne_files[-1].read_text(encoding='utf-8'))
          if not isinstance(old.get('docs'), list) or not old['docs']:
              raise RuntimeError('Eski karne arsivi gecersiz')
          (public / 'barem-arsiv.ndjson').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          shutil.copyfile(karne_files[-1], public / 'karne-eski.json')
          shutil.copyfile(patch, public / 'barem-gecmisi.js')
          if 'barem-gecmisi.js' not in html:
              html = html.replace(marker, '<script src="barem-gecmisi.js?v=1"></script>\n' + marker, 1)
              html_path.write_text(html, encoding='utf-8')
          print('BAREM GECMISI V2 HAZIR:', len(lines), 'arsiv kaydi,', len(old['docs']), 'eski karne gunu')
          PY_BAREM_GECMISI

      - name: Hizlandirma V1 (dayKey ve injOf onbellegi) yamasini ekle
        # Bu yama basarisiz olursa site yine eski haliyle yayinlansin.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_HIZLANDIRMA'
          import shutil
          from pathlib import Path
          public = Path('public')
          html_path = public / 'index.html'
          patch = Path('site-patches/hizlandirma-v1.js')
          if not patch.is_file() or not html_path.is_file():
              raise RuntimeError('Hizlandirma: yama veya index.html yok; dokunulmadi')
          html = html_path.read_text(encoding='utf-8')
          marker = '<script src="baslat.js'
          if 'hizlandirma-v1.js' not in html and marker not in html:
              raise RuntimeError('Hizlandirma: baslat.js etiketi bulunamadi; dokunulmadi')
          shutil.copyfile(patch, public / 'hizlandirma-v1.js')
          if 'hizlandirma-v1.js' not in html:
              html = html.replace(marker, '<script src="hizlandirma-v1.js?v=20261123a"></script>\n' + marker, 1)
              html_path.write_text(html, encoding='utf-8')
          print('HIZLANDIRMA V1 HAZIR')
          PY_HIZLANDIRMA

      - name: Son guncellemeler ve veri zamanlarini siteye ekle
        shell: bash
        run: python3 scripts/site_update_status.py --site public --seed seed

      - name: Hazirlanan siteyi indirilebilir test paketi olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: cizgi-masasi-site-onizleme-${{ github.run_id }}
          path: public/
          retention-days: 3
          if-no-files-found: error

      - name: Cloudflare Pages'e yayinla
        if: steps.gerek.outputs.yayinla != 'false' && (github.event_name == 'workflow_run' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.yayinla == true))
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=cizgi-masasi --branch=main
