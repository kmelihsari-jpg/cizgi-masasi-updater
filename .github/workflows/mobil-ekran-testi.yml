name: Cizgi Masasi - Mobil Ekran Testi
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobil-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright + Chrome kur
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Gercek canli sayfayi telefon boyutlarinda incele
        run: python scripts/mobile_audit.py
      - name: Ekran goruntuleri ve raporu ekle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cizgi-masasi-mobil-ekran-goruntuleri
          path: mobile-audit-results/
          retention-days: 7
