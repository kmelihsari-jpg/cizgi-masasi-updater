
name: NBA Resmi Sakatlik Senkronizasyonu

on:
  workflow_dispatch:
  # Zamanlama artik Cloudflare Worker'da (cizgi-sakatlik-tetik): GitHub'in kendi cron'u gecikmeli/atlamali oldugu icin
  # kapatildi. Worker bu workflow'u workflow_dispatch ile tetikler. Cron saatleri Worker'daki Trigger events'te (UTC):
  # '5 14-16 * * *', '5,35 17-18 * * *', '5,20,35,50 19-23,0-2 * * *'

permissions:
  contents: read

concurrency:
  group: nba-injury-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri kur
        run: pip install requests pdfplumber beautifulsoup4

      - name: NBA resmi raporunu D1'e aktar
        env:
          NBA_IMPORT_TOKEN: ${{ secrets.NBA_IMPORT_TOKEN }}
          WORKER_URL: https://cizgi-masasi-api.k-melihsari.workers.dev
        run: python scripts/nba_official.py
