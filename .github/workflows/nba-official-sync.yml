
name: NBA Resmi Sakatlik Senkronizasyonu

on:
  workflow_dispatch:
  schedule:
    # Zamanlar UTC (Turkiye = UTC+3). GitHub zamanlanmis isleri :00/:15/:30/:45 gibi yogun dakikalarda
    # geciktirir; bu yuzden dakikalar bilerek yogun olmayan degerlere kaydirildi (07, 22, 37, 52 ...).
    # GECE 20:00-06:00 TR (17:00-03:00 UTC): 15 dakikada bir
    - cron: '7,22,37,52 17-23,0-2 * * *'
    # GUNDUZ 06:00-20:00 TR (03:00-17:00 UTC): 40 dakikada bir
    #   cift saatler (04,06,...,16 UTC): :07 ve :47 ; tek saatler (03,05,...,15 UTC): :27
    - cron: '7,47 4-16/2 * * *'
    - cron: '27 3-15/2 * * *'

permissions:
  contents: read

concurrency:
  group: nba-injury-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri kur
        run: pip install requests pdfplumber beautifulsoup4

      - name: NBA resmi raporunu D1'e aktar
        env:
          NBA_IMPORT_TOKEN: ${{ secrets.NBA_IMPORT_TOKEN }}
          WORKER_URL: https://cizgi-masasi-api.k-melihsari.workers.dev
        run: python scripts/nba_official.py
