
name: NBA Resmi Sakatlik Senkronizasyonu

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: nba-injury-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri kur
        run: pip install requests pdfplumber beautifulsoup4

      - name: NBA PDF oku ve D1'e aktar
        env:
          NBA_IMPORT_TOKEN: ${{ secrets.NBA_IMPORT_TOKEN }}
          WORKER_URL: https://cizgi-masasi-api.k-melihsari.workers.dev
        run: python scripts/nba_official.py --dry-run
