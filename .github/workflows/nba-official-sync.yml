
import argparse
import io
import json
import os
import re
from collections import Counter
from datetime import datetime
from urllib.parse import urljoin, urlparse

import pdfplumber
import requests
from bs4 import BeautifulSoup

PAGE = "https://official.nba.com/nba-injury-report-2026-27-season/"
PDF_RX = re.compile(
    r"Injury-Report_(\d{4}-\d{2}-\d{2})_(\d{1,2})_(\d{2})(AM|PM)\.pdf",
    re.I
)
TEAMS = [
    "AtlantaHawks", "BostonCeltics", "BrooklynNets",
    "CharlotteHornets", "ChicagoBulls", "ClevelandCavaliers",
    "DallasMavericks", "DenverNuggets", "DetroitPistons",
    "GoldenStateWarriors", "HoustonRockets", "IndianaPacers",
    "LAClippers", "LosAngelesLakers", "MemphisGrizzlies",
    "MiamiHeat", "MilwaukeeBucks", "MinnesotaTimberwolves",
    "NewOrleansPelicans", "NewYorkKnicks",
    "OklahomaCityThunder", "OrlandoMagic",
    "Philadelphia76ers", "PhoenixSuns",
    "PortlandTrailBlazers", "SacramentoKings",
    "SanAntonioSpurs", "TorontoRaptors", "UtahJazz",
    "WashingtonWizards"
]
TEAM_BY_KEY = {
    re.sub(r"\W", "", x).upper(): x for x in TEAMS
}
STATUSES = {
    "OUT", "QUESTIONABLE", "DOUBTFUL",
    "PROBABLE", "AVAILABLE"
}

S = requests.Session()
S.headers.update({
    "User-Agent": "Mozilla/5.0",
    "Accept": "text/html,application/pdf"
})


def latest_report():
    response = S.get(PAGE, timeout=30)
    print("NBA sayfa HTTP:", response.status_code, flush=True)
    response.raise_for_status()

    found = []
    soup = BeautifulSoup(response.text, "html.parser")

    for link in soup.find_all("a", href=True):
        url = urljoin(PAGE, link["href"])
        parsed = urlparse(url)
        match = PDF_RX.search(parsed.path)

        if parsed.hostname != "ak-static.cms.nba.com":
            continue
        if not match:
            continue

        day, hour, minute, meridian = match.groups()
        stamp = datetime.strptime(
            f"{day} {hour}:{minute} {meridian}",
            "%Y-%m-%d %I:%M %p"
        )
        found.append((stamp, url))

    if not found:
        raise RuntimeError("NBA sayfasinda PDF bulunamadi")

    print("Bulunan PDF sayisi:", len(found), flush=True)
    return max(found, key=lambda value: value[0])


def extract_column(page, left, top, right, bottom):
    if bottom <= top + 1:
        return ""

    clip = page.crop((
        left, top + 0.5,
        right, bottom - 0.5
    ))

    return (
        clip.extract_text(x_tolerance=2, y_tolerance=3)
        or ""
    ).strip()


def normalize_name(raw):
    last, first = raw.rsplit(",", 1)
    last = last.replace(",", " ").strip()

    return re.sub(
        r"\s+", " ",
        f"{first.strip()} {last}"
    ).strip()


def parse_pdf(raw):
    records = []
    missing = set()
    team = None

    with pdfplumber.open(io.BytesIO(raw)) as pdf:
        print("PDF sayfalari:", len(pdf.pages), flush=True)

        for page_number, page in enumerate(pdf.pages, start=1):
            w, h = page.width, page.height

            # Oyuncu satirlarini yatay cizgiler ayirir.
            rules = sorted({
                round(edge["top"], 1)
                for edge in page.edges
                if edge.get("orientation") == "h"
                and edge["x0"] <= w * 0.53
                and edge["x1"] >= w * 0.95
                and h * 0.13 < edge["top"] < h * 0.96
            })

            if len(rules) < 2:
                raise RuntimeError(
                    f"Sayfa {page_number}: satir cizgileri bulunamadi"
                )

            boundaries = [h * 0.13] + rules

            for top, bottom in zip(
                boundaries, boundaries[1:]
            ):
                # PDF sutunlarini ayri ayri oku.
                left = extract_column(
                    page, w * 0.30, top,
                    w * 0.50, bottom
                )
                player = extract_column(
                    page, w * 0.50, top,
                    w * 0.69, bottom
                )
                state = extract_column(
                    page, w * 0.69, top,
                    w * 0.79, bottom
                ).upper()
                reason = extract_column(
                    page, w * 0.79, top,
                    w * 0.995, bottom
                )

                for line in left.splitlines():
                    key = re.sub(
                        r"[^A-Za-z0-9]", "", line
                    ).upper()

                    matched_team = TEAM_BY_KEY.get(key)

                    if matched_team:
                        team = matched_team

                # Ilk satirdaki basliklari temizle.
                player = re.sub(
                    r"^Player Name\s*", "",
                    player, flags=re.I
                ).strip()

                state = re.sub(
                    r"^CURRENT STATUS\s*", "",
                    state
                ).strip()

                reason = re.sub(
                    r"^Reason\s*", "",
                    reason, flags=re.I
                ).strip()

                if "NOT YET SUBMITTED" in reason.upper():
                    if team:
                        missing.add(team)
                    continue

                player_lines = [
                    x.strip()
                    for x in player.splitlines()
                    if "," in x
                ]

                statuses = [
                    x.strip()
                    for x in state.splitlines()
                    if x.strip() in STATUSES
                ]

                if player_lines and statuses:
                    if not team:
                        raise RuntimeError(
                            "Takimsiz oyuncu: "
                            + str(player_lines)
                        )

                    if (
                        len(player_lines) != 1
                        or len(statuses) != 1
                    ):
                        raise RuntimeError(
                            "Bir satirda birden fazla oyuncu bulundu"
                        )

                    records.append({
                        "player_name": normalize_name(
                            player_lines[0]
                        ),
                        "team": team,
                        "status": statuses[0],
                        "reason": re.sub(
                            r"\s+", " ", reason
                        ).strip()
                    })

                elif (
                    reason
                    and records
                    and not player_lines
                    and not statuses
                ):
                    # Onceki oyuncunun aciklamasi
                    # sayfa degisse bile devam edebilir.
                    records[-1]["reason"] = (
                        records[-1]["reason"]
                        + " "
                        + reason
                    ).strip()

    if len(records) < 20:
        raise RuntimeError(
            "Supheli oyuncu sayisi: "
            + str(len(records))
        )

    seen = set()

    for row in records:
        key = (
            row["team"],
            row["player_name"]
        )

        if (
            key in seen
            or not row["reason"]
            or len(row["reason"]) > 500
        ):
            raise RuntimeError(
                "Gecersiz oyuncu: " + str(row)
            )

        seen.add(key)

    return records, sorted(missing)


def main():
    parser = argparse.ArgumentParser()
    parser.add_argument(
        "--dry-run",
        action="store_true"
    )
    args = parser.parse_args()

    print(
        "=== CIZGI MASASI NBA READER V3 ===",
        flush=True
    )

    stamp, url = latest_report()
    print("Secilen PDF:", url, flush=True)

    response = S.get(url, timeout=45)
    print("PDF HTTP:", response.status_code, flush=True)
    response.raise_for_status()

    if not response.content.startswith(b"%PDF-"):
        raise RuntimeError("Indirilen dosya PDF degil")

    records, missing = parse_pdf(
        response.content
    )

    print("Oyuncular:", len(records), flush=True)
    print(
        "Durumlar:",
        dict(Counter(
            p["status"] for p in records
        )),
        flush=True
    )
    print(
        "Rapor gondermeyen takimlar:",
        len(missing),
        flush=True
    )

    # Ozellikle onceki hatalari kontrol et.
    names = [
        "Bryce McGowens",
        "Yves Missi",
        "Ben Saraf",
        "Nolan Traore",
        "Jarrett Allen"
    ]

    for name in names:
        match = next(
            (
                r for r in records
                if r["player_name"] == name
            ),
            None
        )
        print(
            "KONTROL:",
            json.dumps(
                match,
                ensure_ascii=False
            ),
            flush=True
        )

    if args.dry_run:
        print(
            "TEST TAMAMLANDI - VERITABANINA YAZILMADI",
            flush=True
        )
        return

    token = os.getenv("NBA_IMPORT_TOKEN")
    if not token:
        raise RuntimeError(
            "NBA_IMPORT_TOKEN bulunamadi"
        )

    worker = os.getenv(
        "WORKER_URL",
        "https://cizgi-masasi-api.k-melihsari.workers.dev"
    ).rstrip("/")

    if not worker.startswith("https://"):
        raise RuntimeError(
            "WORKER_URL HTTPS olmali"
        )

    payload = {
        "report_url": url,
        "report_key": stamp.strftime(
            "%Y-%m-%d_%H%M"
        ),
        "report_date": stamp.strftime(
            "%Y-%m-%d %H:%M ET"
        ),
        "players": records,
        "not_submitted_teams": missing
    }

    result = S.post(
        worker + "/api/import-nba",
        json=payload,
        headers={
            "Authorization": "Bearer " + token
        },
        timeout=45
    )

    print(
        "D1 HTTP:",
        result.status_code,
        flush=True
    )
    print(
        "D1 yaniti:",
        result.text[:1000],
        flush=True
    )

    result.raise_for_status()

    data = result.json()

    if not data.get("success"):
        raise RuntimeError(
            "D1 aktarimi basarisiz"
        )

    if data.get("skipped"):
        print(
            "Ayni veya eski rapor atlandi",
            flush=True
        )
    elif data.get("stored") != len(records):
        raise RuntimeError(
            "Kayit sayisi uyusmuyor"
        )
    else:
        print(
            "NBA D1 AKTARIMI BASARILI",
            flush=True
        )


if __name__ == "__main__":
    main()
