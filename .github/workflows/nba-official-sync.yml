
name: NBA Resmi Sakatlik Senkronizasyonu

on:
  workflow_dispatch:
  schedule:
    # Zamanlar UTC (Turkiye = UTC+3). Ucretsiz Actions kotasi (2000 dk/ay) icin sinirli: ~39 kosu/gun.
    # NBA raporu :00/:15/:30/:45'te yayinlandigi icin her kosu yayindan 5 dk sonra (:05/:20/:35/:50).
    # 06:00-17:00 TR: calismaz (03:00-14:00 UTC)
    # 17:00-20:00 TR: saatte 1  (14-16 UTC, :05)
    - cron: '5 14-16 * * *'
    # 20:00-22:00 TR: 30 dakikada bir (17-18 UTC, :05 ve :35)
    - cron: '5,35 17-18 * * *'
    # 22:00-06:00 TR: 15 dakikada bir (19-23 ve 00-02 UTC)
    - cron: '5,20,35,50 19-23,0-2 * * *'

permissions:
  contents: read

concurrency:
  group: nba-injury-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri kur
        run: pip install requests pdfplumber beautifulsoup4

      - name: NBA resmi raporunu D1'e aktar
        env:
          NBA_IMPORT_TOKEN: ${{ secrets.NBA_IMPORT_TOKEN }}
          WORKER_URL: https://cizgi-masasi-api.k-melihsari.workers.dev
        run: python scripts/nba_official.py
