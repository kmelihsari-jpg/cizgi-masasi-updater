
name: NBA Resmi Sakatlik Senkronizasyonu

on:
  workflow_dispatch:
  # Zamanlama artik Cloudflare Worker'da (cizgi-sakatlik-tetik): GitHub'in kendi cron'u gecikmeli/atlamali oldugu icin
  # kapatildi. Worker bu workflow'u workflow_dispatch ile tetikler. Tek cron '5,20,35,50 * * * *' (UTC); hangi tikte
  # tetiklenecegi worker/sakatlik-tetik.js icindeki SAKATLIK_SLOTLARI'nda (Istanbul): 09:05, 13:05, 17-22 saatte 1,
  # 22-03 15 dk, 03-05 30 dk. Gunde 31 tetik (20 Kasim 2026).

permissions:
  contents: read

concurrency:
  group: nba-injury-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri kur
        run: pip install requests pdfplumber beautifulsoup4

      - name: NBA resmi raporunu D1'e aktar
        env:
          NBA_IMPORT_TOKEN: ${{ secrets.NBA_IMPORT_TOKEN }}
          WORKER_URL: https://cizgi-masasi-api.k-melihsari.workers.dev
        run: python scripts/nba_official.py
