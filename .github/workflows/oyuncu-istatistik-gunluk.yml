
name: Cizgi Masasi - Gunluk Oyuncu Istatistikleri

on:
  workflow_dispatch:
  # Eski ESPN yontemi sadece elle baslatilabilir.
  # Gunluk zamanlama NBA CDN is akisina tasindi.

permissions:
  contents: write

concurrency:
  group: cizgi-masasi-oyuncu-istatistik-main
  cancel-in-progress: false

jobs:
  gunluk-guncelle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Eski testleri calistir
        run: |
          python scripts/test_updater.py
          python tests/test_phantom_rows.py
          python tests/test_box_quality.py

      - name: Yeni maclari cek ve dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -f seed/data.json
          cp seed/data.json /tmp/cizgi-onceki-data.json
          python scripts/update_nba_stats.py --site seed --days 7 --limit 160 | tee /tmp/cizgi-updater.log
          if grep -E 'ERROR |Insufficient roster match|Missing two verified team scores' /tmp/cizgi-updater.log; then
            echo 'HATA: Eksik mac verisi bulundu. Bu calistirmada commit yapilmayacak.'
            exit 1
          fi
          python -m json.tool seed/data.json >/dev/null
          python -c '
          import json
          a=json.load(open("/tmp/cizgi-onceki-data.json",encoding="utf-8"))
          b=json.load(open("seed/data.json",encoding="utf-8"))
          for k in ("cols","season","teams","players"):
              assert a[k]==b[k], f"Korunmasi gereken alan degisti: {k}"
          assert len(b["rows"]) >= len(a["rows"]), "Onceki mac kayitlari kayboldu"
          c={v:i for i,v in enumerate(b["cols"])}
          keys=set()
          for r in b["rows"]:
              assert len(r)==len(b["cols"]), "Bozuk oyuncu-mac satiri"
              key=(r[c["pid"]],b["dates"][r[c["d"]]],b["teams"][r[c["t"]]])
              assert key not in keys, "Cift oyuncu-mac kaydi"
              keys.add(key)
          print("DOGRU:",len(a["rows"]),"->",len(b["rows"]),"oyuncu-mac kaydi")
          '
          python tests/test_phantom_rows.py
          python tests/test_box_quality.py

      - name: Kalici GitHub kaydini yap
        shell: bash
        run: |
          set -euo pipefail
          git add seed/data.json
          if test -f seed/rotation-live.json; then
            git add seed/rotation-live.json
          fi
          if git diff --cached --quiet; then
            echo 'Yeni mac yok; kayit degismedi.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: update completed NBA player boxscores'
            git push origin HEAD:main
            echo 'BASARILI: seed/data.json GitHub ana dalina kaydedildi.'
          fi

      - name: Islem raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cizgi-gunluk-oyuncu-log-${{ github.run_id }}
          path: /tmp/cizgi-updater.log
          if-no-files-found: ignore
          retention-days: 7
