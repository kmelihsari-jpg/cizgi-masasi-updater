name: Cizgi Masasi - Bulut Tracking Kaynak Testi
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test player-level tracking endpoints (read-only)
        run: python scripts/tracking_cloud_probe.py
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-cloud-probe
          path: out/tracking-cloud-probe.json
          if-no-files-found: warn
          retention-days: 7
